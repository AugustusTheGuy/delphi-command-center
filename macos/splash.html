<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delphi</title>
<style>
html, body { margin: 0; height: 100%; background: #050506; overflow: hidden; }
</style>
</head>
<body>

<style>
.dhc-splash {
  position: fixed;
  inset: 0;
  z-index: 100000;
  background: #050506;
  pointer-events: auto;
  animation: dhc-splash-hold 6.7s linear forwards;
}
.dhc-stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(68vmin, 560px);
  height: min(68vmin, 560px);
  transform: translate(-50%, -50%);
}
.dhc-arm {
  position: absolute;
  background: linear-gradient(90deg, #8d969f 0%, #f5f7f8 48%, #ffffff 50%, #f5f7f8 52%, #8d969f 100%);
  box-shadow: 0 0 6px rgba(214, 222, 230, 0.45);
}
.dhc-arm-h {
  left: 0;
  top: 50%;
  width: 100%;
  height: 2px;
  animation: dhc-h 6.7s linear forwards;
}
.dhc-arm-v {
  left: 50%;
  top: 0;
  width: 2px;
  height: 100%;
  background: linear-gradient(180deg, #8d969f 0%, #f5f7f8 48%, #ffffff 50%, #f5f7f8 52%, #8d969f 100%);
  animation: dhc-v 6.7s linear forwards;
}
.dhc-mark {
  position: absolute;
  width: 72px;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e8edf2;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 48px;
  font-weight: 800;
  line-height: 1;
  text-shadow: 0 0 8px rgba(220, 228, 236, 0.45);
}
.dhc-mark-x { left: 25%; top: 25%; animation: dhc-x 6.7s linear forwards; }
.dhc-mark-d { left: 75%; top: 25%; animation: dhc-d 6.7s linear forwards; }
.dhc-mark-p { left: 25%; top: 75%; animation: dhc-p 6.7s linear forwards; }
.dhc-mark-m { left: 75%; top: 75%; animation: dhc-m 6.7s linear forwards; }
.dhc-flash {
  position: absolute;
  inset: 0;
  background: transparent;
  opacity: 0;
  pointer-events: none;
  animation: dhc-flash 6.7s linear forwards;
}
@keyframes dhc-splash-hold {
  0%, 98.6% { opacity: 1; visibility: visible; pointer-events: auto; }
  100% { opacity: 0; visibility: hidden; pointer-events: none; }
}
@keyframes dhc-h {
  0% { transform: translate(-80vw, -50%); filter: brightness(1); }
  10.4% { transform: translate(0, -50%); filter: brightness(1); box-shadow: 0 0 6px rgba(214, 222, 230, 0.45); }
  14% { transform: translate(0, -50%); filter: brightness(1.35); box-shadow: 0 0 12px 2px rgba(232, 238, 244, 0.9); }
  17.2% { transform: translate(0, -50%); filter: brightness(1.05); box-shadow: 0 0 8px 1px rgba(214, 222, 230, 0.5); }
  18.8% { transform: translate(0, -50%); filter: brightness(2.4); box-shadow: 0 0 22px 6px #fff; background: transparent; }
  20.4% { transform: translate(0, -50%); filter: brightness(1.05); box-shadow: 0 0 8px 1px rgba(214, 222, 230, 0.5); background: transparent; }
  85.1% { transform: translate(0, -50%); filter: brightness(1.05); opacity: 1; }
  86.8% { transform: translate(0, -50%); filter: brightness(1.8); box-shadow: 0 0 14px 1px #fff; /* unison */ }
  88.5% { transform: translate(0, -50%); filter: brightness(1.15); }
  90.2% { transform: translate(0, -50%); filter: brightness(1.8); box-shadow: 0 0 14px 1px #fff; /* unison */ }
  91.9% { transform: translate(0, -50%); filter: brightness(1.15); }
  93.7% { transform: translate(0, -50%); filter: brightness(1.8); box-shadow: 0 0 14px 1px #fff; /* unison */ }
  95.5% { transform: translate(0, -50%); filter: brightness(1); opacity: 1; }
  100% { transform: translate(0, -50%); opacity: 0; }
}
@keyframes dhc-v {
  0%, 20.4% { transform: translate(-50%, 70vh); filter: brightness(1); }
  32.1% { transform: translate(-50%, 0); filter: brightness(1); box-shadow: 0 0 6px rgba(214, 222, 230, 0.45); }
  35% { transform: translate(-50%, 0); filter: brightness(2.05); box-shadow: 0 0 28px 6px rgba(245, 248, 252, 0.95); }
  37.3% { transform: translate(-50%, 0); filter: brightness(1.1); box-shadow: 0 0 8px 1px rgba(214, 222, 230, 0.5); }
  39% { transform: translate(-50%, 0); filter: brightness(2.8); box-shadow: 0 0 18px 2px #fff; background: transparent; }
  40.6% { transform: translate(-50%, 0); filter: brightness(1.1); box-shadow: 0 0 8px 1px rgba(214, 222, 230, 0.5); background: transparent; }
  85.1% { transform: translate(-50%, 0); filter: brightness(1.1); opacity: 1; }
  86.8% { transform: translate(-50%, 0); filter: brightness(1.8); box-shadow: 0 0 14px 1px #fff; /* unison */ }
  88.5% { transform: translate(-50%, 0); filter: brightness(1.15); }
  90.2% { transform: translate(-50%, 0); filter: brightness(1.8); box-shadow: 0 0 14px 1px #fff; /* unison */ }
  91.9% { transform: translate(-50%, 0); filter: brightness(1.15); }
  93.7% { transform: translate(-50%, 0); filter: brightness(1.8); box-shadow: 0 0 14px 1px #fff; /* unison */ }
  95.5% { transform: translate(-50%, 0); filter: brightness(1); opacity: 1; }
  100% { transform: translate(-50%, 0); opacity: 0; }
}
@keyframes dhc-x {
  0%, 40.6% { transform: translate(-50%, calc(-50% - 70vh)); opacity: 0; filter: brightness(1); }
  42% { opacity: 1; }
  49.3%, 85.1% { transform: translate(-50%, -50%); opacity: 1; filter: brightness(1); }
  86.8% { transform: translate(-50%, -50%); filter: brightness(1.8); text-shadow: 0 0 14px #fff; /* unison */ }
  88.5% { transform: translate(-50%, -50%); filter: brightness(1.15); }
  90.2% { transform: translate(-50%, -50%); filter: brightness(1.8); text-shadow: 0 0 14px #fff; /* unison */ }
  91.9% { transform: translate(-50%, -50%); filter: brightness(1.15); }
  93.7% { transform: translate(-50%, -50%); filter: brightness(1.8); text-shadow: 0 0 14px #fff; /* unison */ }
  95.5% { transform: translate(-50%, -50%); filter: brightness(1); opacity: 1; }
  100% { transform: translate(-50%, -50%); opacity: 0; }
}
@keyframes dhc-d {
  0%, 49.3% { transform: translate(calc(-50% + 75vw), -50%); opacity: 0; filter: brightness(1); }
  57.9% { transform: translate(-50%, -50%); opacity: 1; filter: brightness(1); }
  59.5% { transform: translate(-50%, -50%); filter: brightness(2.4); text-shadow: 0 0 18px #fff; }
  61.2%, 85.1% { transform: translate(-50%, -50%); filter: brightness(1); opacity: 1; }
  86.8% { transform: translate(-50%, -50%); filter: brightness(1.8); text-shadow: 0 0 14px #fff; /* unison */ }
  88.5% { transform: translate(-50%, -50%); filter: brightness(1.15); }
  90.2% { transform: translate(-50%, -50%); filter: brightness(1.8); text-shadow: 0 0 14px #fff; /* unison */ }
  91.9% { transform: translate(-50%, -50%); filter: brightness(1.15); }
  93.7% { transform: translate(-50%, -50%); filter: brightness(1.8); text-shadow: 0 0 14px #fff; /* unison */ }
  95.5% { transform: translate(-50%, -50%); opacity: 1; filter: brightness(1); }
  100% { transform: translate(-50%, -50%); opacity: 0; }
}
@keyframes dhc-p {
  0%, 61.2% { transform: translate(-50%, calc(-50% + 70vh)); opacity: 0; filter: brightness(1); }
  69.9% { transform: translate(-50%, -50%); opacity: 1; filter: brightness(1); }
  71.5% { transform: translate(-50%, -50%); filter: brightness(2.4); text-shadow: 0 0 18px #fff; }
  73.1%, 85.1% { transform: translate(-50%, -50%); filter: brightness(1); opacity: 1; }
  86.8% { transform: translate(-50%, -50%); filter: brightness(1.8); text-shadow: 0 0 14px #fff; /* unison */ }
  88.5% { transform: translate(-50%, -50%); filter: brightness(1.15); }
  90.2% { transform: translate(-50%, -50%); filter: brightness(1.8); text-shadow: 0 0 14px #fff; /* unison */ }
  91.9% { transform: translate(-50%, -50%); filter: brightness(1.15); }
  93.7% { transform: translate(-50%, -50%); filter: brightness(1.8); text-shadow: 0 0 14px #fff; /* unison */ }
  95.5% { transform: translate(-50%, -50%); opacity: 1; filter: brightness(1); }
  100% { transform: translate(-50%, -50%); opacity: 0; }
}
@keyframes dhc-m {
  0%, 73.1% { transform: translate(calc(-50% + 75vw), -50%); opacity: 0; filter: brightness(1); }
  81.8% { transform: translate(-50%, -50%); opacity: 1; filter: brightness(1); }
  83.4% { transform: translate(-50%, -50%); filter: brightness(2.4); text-shadow: 0 0 18px #fff; }
  85.1% { transform: translate(-50%, -50%); filter: brightness(1); opacity: 1; }
  86.8% { transform: translate(-50%, -50%); filter: brightness(1.8); text-shadow: 0 0 14px #fff; /* unison */ }
  88.5% { transform: translate(-50%, -50%); filter: brightness(1.15); }
  90.2% { transform: translate(-50%, -50%); filter: brightness(1.8); text-shadow: 0 0 14px #fff; /* unison */ }
  91.9% { transform: translate(-50%, -50%); filter: brightness(1.15); }
  93.7% { transform: translate(-50%, -50%); filter: brightness(1.8); text-shadow: 0 0 14px #fff; /* unison */ }
  95.5% { transform: translate(-50%, -50%); opacity: 1; filter: brightness(1); }
  100% { transform: translate(-50%, -50%); opacity: 0; }
}
@keyframes dhc-flash {
  0%, 95.5% { opacity: 0; }
  97.3% { opacity: 1; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .dhc-splash { display: none !important; }
}
</style>
<div class="dhc-splash" aria-hidden="true">
  <div class="dhc-stage">
    <div class="dhc-arm dhc-arm-h"></div>
    <div class="dhc-arm dhc-arm-v"></div>
    <div class="dhc-mark dhc-mark-x">✖️</div>
    <div class="dhc-mark dhc-mark-d">➗</div>
    <div class="dhc-mark dhc-mark-p">➕</div>
    <div class="dhc-mark dhc-mark-m">➖</div>
  </div>
  <div class="dhc-flash"></div>
</div>

</body>
</html>
